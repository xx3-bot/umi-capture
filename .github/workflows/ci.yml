name: Public source CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/macos/requirements-receiver.txt
      - run: python3 -m pip install -r apps/macos/requirements-receiver.txt
      - run: tools/verify_public_source.sh

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: pod install --project-directory=apps/ios
      - run: >-
          xcodebuild build
          -workspace apps/ios/UMICapture.xcworkspace
          -scheme UMICapture
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/umi_capture-ios"
          CODE_SIGNING_ALLOWED=NO

  public-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
